version: "2"

run:
  timeout: 5m
  # The end-to-end suite is behind `//go:build integration` so that
  # `go test ./...` stays fast. A tag that hides a package from the test runner
  # hides it from the linters too, and an unlinted package is exactly where the
  # findings this repo has already shipped twice — a gosec hit and a test that
  # did not compile under another GOOS — come from.
  build-tags:
    - integration

# Report every finding. The defaults cap a linter at 50 issues and, worse, cap
# repeated issues with the same text at 3 — which silently truncated the G103
# unsafe findings in the Win32 interop to three of the six that exist, and hid
# the two sites that were genuinely missing a runtime.KeepAlive. A lint list
# that quietly stops short is worse than a long one, because it is read as
# complete.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # Generated protobuf code is not ours to lint.
      - path: ^gen/
        linters:
          - errcheck
          - gosec
          - revive
          - staticcheck
          - unused
      # Table-driven tests routinely ignore errors that the assertion covers.
      - path: _test\.go$
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/axelmierczuk/fleet-mcp
  exclusions:
    generated: lax
