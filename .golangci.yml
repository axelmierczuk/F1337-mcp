version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # Generated protobuf code is not ours to lint.
      - path: ^gen/
        linters:
          - errcheck
          - gosec
          - revive
          - staticcheck
          - unused
      # Table-driven tests routinely ignore errors that the assertion covers.
      - path: _test\.go$
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/axelmierczuk/sandboxd-mcp
  exclusions:
    generated: lax
