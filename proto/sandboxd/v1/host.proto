syntax = "proto3";

package sandboxd.v1;

import "google/protobuf/timestamp.proto";
import "sandboxd/v1/common.proto";

option go_package = "github.com/axelmierczuk/fleet-mcp/gen/go/sandboxd/v1;sandboxdv1";

// HostService reports identity, capability, and liveness for a sandbox host.
// It is the first service the MCP server calls after dialing an agent.
service HostService {
  // GetHostInfo returns a full description of the host: platform, resources,
  // detected toolchains, agent version, and the roots the agent will permit
  // filesystem access under.
  rpc GetHostInfo(GetHostInfoRequest) returns (GetHostInfoResponse);

  // Health is a cheap liveness and readiness probe used to populate sandbox
  // status in fleet_list without paying for full host introspection.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message GetHostInfoRequest {
  // When true, probe the filesystem for installed toolchains. This is
  // measurably slower than the rest of the call, so it is opt-in.
  bool include_toolchains = 1;
}

message GetHostInfoResponse {
  Platform platform = 1;
  Resources resources = 2;
  repeated Toolchain toolchains = 3;
  // Semantic version of the fleet-agent binary serving this request.
  string agent_version = 4;
  // Absolute paths the agent will allow filesystem operations under. Empty
  // means the agent is running without a path jail, which it warns about.
  repeated string allowed_roots = 5;
  // When the agent process started, used to detect restarts.
  google.protobuf.Timestamp started_at = 6;
  // Subject common name from the client certificate the agent authenticated,
  // echoed back so the caller can confirm which identity it is using.
  string authenticated_principal = 7;
  // What this agent will connect to on a caller's behalf.
  ForwardPolicy forward_policy = 8;
}

// ForwardPolicy is the agent's own account of its pivot configuration.
//
// It is reported for the same reason allowed_roots is: a caller has to be able
// to find out what a host permits before it depends on it, and "the agent
// refuses SOCKS" is far more useful arriving when a proxy is being started
// than on the first connection through one. It describes configuration and is
// never itself a boundary — the agent enforces this policy per connection,
// whatever a caller has been told or believes.
message ForwardPolicy {
  // Whether ForwardService is on at all (forward.enabled).
  bool enabled = 1;
  // Whether this agent will carry SOCKS5-proxied connections
  // (forward.socks_enabled). False is the default.
  bool socks_enabled = 2;
  // The non-loopback hosts, addresses and CIDRs this agent will connect to
  // (forward.allowed_hosts), as the operator wrote them.
  //
  // Empty is meaningful in two different ways depending on socks_enabled, and
  // this is the field a caller reads to tell them apart: with it off, empty
  // means "loopback only"; with it on, empty means "any host this machine can
  // reach", which is the one configuration in which this agent is an
  // unrestricted network pivot.
  repeated string allowed_hosts = 3;
}

message HealthRequest {}

message HealthResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SERVING = 1;
    STATUS_DEGRADED = 2;
    STATUS_DRAINING = 3;
  }

  Status status = 1;
  // Human-readable explanation, populated when status is not SERVING.
  string message = 2;
  string agent_version = 3;
  // Number of supervised background processes currently tracked.
  uint32 running_processes = 4;
}
