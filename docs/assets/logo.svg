<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Three connected sandboxes</title>

  <!--
    Three unit cubes in true 2:1 isometric projection, standing on one ground
    plane at grid cells (0,0), (3,0) and (3,3). Projection, in user units:

        P(X,Y,Z) = ( 15.5 + (X-Y)*11 , 15.5 + (X+Y)*5.5 - Z*11 )

    Square-section beams of half-size 0.13 join the cubes through their volume
    centres, at height Z=0.5. They are drawn face-to-face rather than
    centre-to-centre, because the segment inside a cube is not visible:

        LT -> R    along +X,  X from 1 to 3,  at Y=0.5
        R  -> LB   along +Y,  Y from 1 to 3,  at X=3.5
        LT -> LB   along the (1,1) diagonal,  from (1,1) to (3,3)

    DEPTH ORDER IS LEAD, NOT DECORATION. A beam leaving a cube through that
    cube's own face is nearer than the cube, so it paints OVER it and visibly
    plugs into the centre of the face. Approaching the far cube it is behind,
    so it vanishes into that cube's silhouette, which is correct: the face it
    enters is turned away from the viewer. Painting every beam behind every
    cube instead makes each one surface at a silhouette CORNER, which reads as
    connected-at-the-corner. Hence the back-to-front order:

        LT cube, beam LT->R, beam LT->LB, R cube, beam R->LB, LB cube

    The beams never overlap one another on screen, so only cube-vs-beam order
    matters. The diagonal beam needs two corrections the axial ones do not:

      1. RIDGED SECTION. Its section is rotated 45 degrees about its own axis.
         A square section on that axis would put its side faces exactly
         edge-on, since both the bar axis and z project to screen-vertical, and
         render as a flat plate. The ridge's two upper facets project as real
         quads instead.

      2. MITRED START. It leaves through the cube's front vertical EDGE rather
         than a face: travelling along (1,1) it crosses X=1 and Y=1 at the same
         instant. Cutting it square to its own axis (the plane X+Y=2) matches
         neither cube face and leaves a chevron cap hanging past the corner.
         So the right facet is cut at X=1 and the left facet at Y=1. Each start
         edge then lies in the face it enters and projects at the isometric 1:2
         slope, exactly like the axial beams' starts.

    The 55x55 composition is centred in the 64x64 viewBox.
  -->

  <style>
    /* One "sky" ramp, lightest to darkest, each value declared exactly once.
       Cubes take t1/t2/t3 for their up / down-left / down-right faces. The
       beams take t4/t5, deliberately below every cube tone, so a beam stays
       legible against whichever face it crosses on its way out of a block.

       Light blue carries the mark and dominates by area; t3-t5 exist because a
       pure light blue loses its edges on white. Contrast vs #ffffff / vs
       GitHub dark #0d1117:

         t1  #7DD3FC  1.7 / 11.4      t4  #0369A1  5.9 / 3.2
         t2  #38BDF8  2.1 /  8.8      t5  #075985  7.6 / 2.5
         t3  #0284C7  4.1 /  4.6                                        */
    .t1 { fill: #7DD3FC }
    .t2 { fill: #38BDF8 }
    .t3 { fill: #0284C7 }
    .t4 { fill: #0369A1 }
    .t5 { fill: #075985 }
  </style>

  <!-- back cube, cell (0,0) -->
  <g>
    <path class="t1" d="M15.5 4.5 26.5 10 15.5 15.5 4.5 10Z"/>
    <path class="t2" d="M4.5 10 15.5 15.5 15.5 26.5 4.5 21Z"/>
    <path class="t3" d="M15.5 15.5 26.5 10 26.5 21 15.5 26.5Z"/>
  </g>

  <!-- beam along +X, out of the back cube's right face -->
  <g>
    <path class="t4" d="M22.43 16.11 44.43 27.1 41.57 28.54 19.57 17.54Z"/>
    <path class="t5" d="M19.57 17.54 41.57 28.54 41.57 31.4 19.57 20.39Z"/>
  </g>

  <!-- ridged beam along the (1,1) diagonal, out of the back cube's front edge -->
  <g>
    <path class="t4" d="M12.95 19.72 15.5 18.43 15.5 40.43 12.95 43Z"/>
    <path class="t5" d="M15.5 18.43 15.5 40.43 18.05 43 18.05 19.72Z"/>
  </g>

  <!-- right cube, cell (3,0) -->
  <g>
    <path class="t1" d="M48.5 21 59.5 26.5 48.5 32 37.5 26.5Z"/>
    <path class="t2" d="M37.5 26.5 48.5 32 48.5 43 37.5 37.5Z"/>
    <path class="t3" d="M48.5 32 59.5 26.5 59.5 37.5 48.5 43Z"/>
  </g>

  <!-- beam along +Y, out of the right cube's left face -->
  <g>
    <path class="t4" d="M41.57 32.6 44.43 34.04 22.43 45.03 19.57 43.61Z"/>
    <path class="t5" d="M44.43 34.04 22.43 45.03 22.43 47.89 44.43 36.9Z"/>
  </g>

  <!-- front cube, cell (3,3) -->
  <g>
    <path class="t1" d="M15.5 37.5 26.5 43 15.5 48.5 4.5 43Z"/>
    <path class="t2" d="M4.5 43 15.5 48.5 15.5 59.5 4.5 54Z"/>
    <path class="t3" d="M15.5 48.5 26.5 43 26.5 54 15.5 59.5Z"/>
  </g>
</svg>
