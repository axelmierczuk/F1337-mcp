<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Three connected sandboxes</title>

  <!--
    Three unit cubes in true 2:1 isometric projection, standing on one ground
    plane at grid cells (0,0), (3,0) and (3,3). Projection, in user units:

        P(X,Y,Z) = ( 15.5 + (X-Y)*11 , 15.5 + (X+Y)*5.5 - Z*11 )

    Square-section rods of half-size 0.13 join the cubes through their volume
    centres, at height Z=0.5. The 55x55 composition is centred in the 64x64
    viewBox.

    WHERE A ROD MEETS A CUBE, AND WHY THE THREE DIFFER

    A rod leaving a cube's centre emerges through a FACE only when it travels
    along a ground axis. The two axial rods therefore stop at the face plane
    they exit (X=1 and Y=1) and are painted AFTER that cube, so each visibly
    plugs into the centre of the face. Each is painted BEFORE the cube it
    approaches, which is right: the face it enters there is turned away from
    the viewer, so it should vanish into that cube's silhouette.

        rod +X   X from 1 to 3, at Y=0.5   drawn over cell (0,0), under (3,0)
        rod +Y   Y from 1 to 3, at X=3.5   drawn over cell (3,0), under (3,3)

    The closing rod runs the (1,1) diagonal and cannot do this. Travelling
    diagonally it reaches X=1 and Y=1 at the same instant, so it leaves through
    the cube's vertical EDGE rather than any face, and a symmetric composition
    forces exactly that 45-degree angle. Painted over the cube it lays a dark
    bar across the block's front and ends in a peak floating mid-face. So it is
    instead drawn centre-to-centre and painted FIRST, behind everything: the
    cubes' silhouettes clip it, and it drops from the block on the shared
    centre line. Strictly its far sliver is nearer than the cube, but that
    sliver is degenerate at a tangent exit and showing it costs more than it
    buys.

    That rod's section is also rotated 45 degrees about its own axis into a
    ridge. A square section on this axis would put its side faces exactly
    edge-on, since both the rod axis and z project to screen-vertical, and
    render as a flat plate. The ridge's two upper facets project as real quads.

    Painted back to front:
        diagonal rod, cell (0,0), rod +X, cell (3,0), rod +Y, cell (3,3)
  -->

  <style>
    /* One "sky" ramp, lightest to darkest, each value declared exactly once.
       Cubes take t1/t2/t3 for their up / down-left / down-right faces. The
       rods take t4/t5, deliberately below every cube tone, so a rod stays
       legible against whichever face it crosses on its way out of a block.

       Light blue carries the mark and dominates by area; t3-t5 exist because a
       pure light blue loses its edges on white. Contrast vs #ffffff / vs
       GitHub dark #0d1117:

         t1  #7DD3FC  1.7 / 11.4      t4  #0369A1  5.9 / 3.2
         t2  #38BDF8  2.1 /  8.8      t5  #075985  7.6 / 2.5
         t3  #0284C7  4.1 /  4.6                                        */
    .t1 { fill: #7DD3FC }
    .t2 { fill: #38BDF8 }
    .t3 { fill: #0284C7 }
    .t4 { fill: #0369A1 }
    .t5 { fill: #075985 }
  </style>

  <!-- closing rod, ridged, on the (1,1) diagonal: behind both left cubes -->
  <g>
    <path class="t4" d="M12.95 15.5 15.5 12.93 15.5 45.93 12.95 48.5Z"/>
    <path class="t5" d="M15.5 12.93 15.5 45.93 18.05 48.5 18.05 15.5Z"/>
  </g>

  <!-- back cube, cell (0,0) -->
  <g>
    <path class="t1" d="M15.5 4.5 26.5 10 15.5 15.5 4.5 10Z"/>
    <path class="t2" d="M4.5 10 15.5 15.5 15.5 26.5 4.5 21Z"/>
    <path class="t3" d="M15.5 15.5 26.5 10 26.5 21 15.5 26.5Z"/>
  </g>

  <!-- rod +X, out of the back cube's right face -->
  <g>
    <path class="t4" d="M22.43 16.11 44.43 27.1 41.57 28.54 19.57 17.54Z"/>
    <path class="t5" d="M19.57 17.54 41.57 28.54 41.57 31.4 19.57 20.39Z"/>
  </g>

  <!-- right cube, cell (3,0) -->
  <g>
    <path class="t1" d="M48.5 21 59.5 26.5 48.5 32 37.5 26.5Z"/>
    <path class="t2" d="M37.5 26.5 48.5 32 48.5 43 37.5 37.5Z"/>
    <path class="t3" d="M48.5 32 59.5 26.5 59.5 37.5 48.5 43Z"/>
  </g>

  <!-- rod +Y, out of the right cube's left face -->
  <g>
    <path class="t4" d="M41.57 32.6 44.43 34.04 22.43 45.03 19.57 43.61Z"/>
    <path class="t5" d="M44.43 34.04 22.43 45.03 22.43 47.89 44.43 36.9Z"/>
  </g>

  <!-- front cube, cell (3,3) -->
  <g>
    <path class="t1" d="M15.5 37.5 26.5 43 15.5 48.5 4.5 43Z"/>
    <path class="t2" d="M4.5 43 15.5 48.5 15.5 59.5 4.5 54Z"/>
    <path class="t3" d="M15.5 48.5 26.5 43 26.5 54 15.5 59.5Z"/>
  </g>
</svg>
