<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Three connected sandboxes</title>

  <!--
    Three unit cubes in true 2:1 isometric projection, standing on one ground
    plane at grid cells (0,0), (3,0) and (3,3). Projection, in user units:

        P(X,Y,Z) = ( 15.5 + (X-Y)*11 , 15.5 + (X+Y)*5.5 - Z*11 )

    Square-section beams join the cubes' volume centres (X+.5, Y+.5, .5), so
    they run into the middle of each block rather than along the floor. Two of
    them lie on the +X and +Y ground axes. The third runs the (1,1) diagonal,
    where both the bar axis and z project to screen-vertical — a square section
    there would put its side faces exactly edge-on and render as a flat plate,
    so that beam's section is rotated 45 degrees about its own axis into a
    ridge, whose two upper facets both project as real quads.

    Beams are painted first; the cubes do not overlap one another, so cube
    faces are grouped by orientation rather than by cube.

    The 55x55 composition is centred in the 64x64 viewBox.
  -->

  <style>
    /* Four-step "sky" ramp, lightest to darkest. Cubes take t1/t2/t3 for their
       up / down-left / down-right faces. The beams sit two steps darker so the
       cubes stay the subject: t3 lit, t4 shaded.

       Light blue carries the mark; t3 and t4 exist because a pure light blue
       loses its edges on white. Contrast vs #ffffff / vs GitHub dark #0d1117:

         t1  #7DD3FC   1.7 / 11.4        t3  #0284C7   4.1 / 4.6
         t2  #38BDF8   2.1 /  8.8        t4  #0369A1   5.9 / 3.2  */
    .t1 { fill: #7DD3FC }
    .t2 { fill: #38BDF8 }
    .t3 { fill: #0284C7 }
    .t4 { fill: #0369A1 }
  </style>

  <!-- beams: shaded faces, then lit faces -->
  <g class="t4">
    <path d="M14.07 14.79 47.07 31.29 47.07 34.15 14.07 17.64Z"/>
    <path d="M49.93 31.29 16.93 47.78 16.93 50.64 49.93 34.15Z"/>
    <path d="M15.5 12.93 15.5 45.93 18.05 48.5 18.05 15.5Z"/>
  </g>
  <g class="t3">
    <path d="M16.93 13.36 49.93 29.85 47.07 31.29 14.07 14.79Z"/>
    <path d="M47.07 29.85 49.93 31.29 16.93 47.78 14.07 46.36Z"/>
    <path d="M12.95 15.5 12.95 48.5 15.5 45.93 15.5 12.93Z"/>
  </g>

  <!-- cubes: up faces, down-left faces, down-right faces -->
  <g class="t1">
    <path d="M15.5 4.5 26.5 10 15.5 15.5 4.5 10Z"/>
    <path d="M48.5 21 59.5 26.5 48.5 32 37.5 26.5Z"/>
    <path d="M15.5 37.5 26.5 43 15.5 48.5 4.5 43Z"/>
  </g>
  <g class="t2">
    <path d="M4.5 10 15.5 15.5 15.5 26.5 4.5 21Z"/>
    <path d="M37.5 26.5 48.5 32 48.5 43 37.5 37.5Z"/>
    <path d="M4.5 43 15.5 48.5 15.5 59.5 4.5 54Z"/>
  </g>
  <g class="t3">
    <path d="M15.5 15.5 26.5 10 26.5 21 15.5 26.5Z"/>
    <path d="M48.5 32 59.5 26.5 59.5 37.5 48.5 43Z"/>
    <path d="M15.5 48.5 26.5 43 26.5 54 15.5 59.5Z"/>
  </g>
</svg>
