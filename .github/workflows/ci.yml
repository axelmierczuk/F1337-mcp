name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tooling
        run: make tools
      - name: Lint and format
        run: make proto-lint
      - name: Verify committed codegen is current
        run: make proto-check
      - name: Check for breaking wire changes
        if: github.event_name == 'pull_request'
        run: make proto-breaking

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The agent runs on all three; test on all three rather than trusting
        # that cross-compilation implies correct platform behaviour. Process
        # groups, signals, and path handling are exactly where that assumption
        # breaks.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      # With the integration tag, so the end-to-end suite is typechecked on
      # every platform including the one it skips itself on. A test that does
      # not compile under GOOS=windows has reached this repository's CI once
      # already, and `go test ./...` below cannot see a tagged file.
      - run: go vet -tags integration ./...
      - run: go test -race -count=1 ./...

  integration:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms the suite can drive. It skips itself on Windows —
        # the workloads it runs on a sandbox are POSIX — and says so rather
        # than reporting a coverage it does not have; see test/e2e/README.md.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: End-to-end suite
        run: make test-integration
      # The container scenario runs only on Linux, where the runner has a
      # Docker daemon. It is the one place "the timeout left no survivors" can
      # be asserted against a whole PID namespace instead of a process group.
      - name: End-to-end suite (containerised tree-kill)
        if: runner.os == 'Linux'
        run: make test-integration-docker

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Once per target OS, not once for the host. Linting only GOOS=linux
      # leaves every _windows.go and _darwin.go file unlinted, which is how a
      # gosec finding inside a _linux.go file reached a green local run and a
      # red CI once already. The test matrix covers `go vet` on all three
      # runners; only the linters were host-only, and cross-linting needs no
      # runner of that OS. Kept as three steps in one job rather than a matrix
      # so the required check stays named "Lint".
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
        env:
          GOOS: linux
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
        env:
          GOOS: darwin
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
        env:
          GOOS: windows

  cross-compile:
    name: Cross-compile agent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build agent for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/fleet-agent

  installer:
    name: Shellcheck installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck install.sh
        run: shellcheck --severity=warning install.sh
      - name: Lint install.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error,Warning
          if ($issues) { $issues | Format-Table -AutoSize; exit 1 }
