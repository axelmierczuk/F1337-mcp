# fleet-agent configuration.
#
# Written to /etc/fleet/agent.yaml (Linux), /Library/Application
# Support/fleet/agent.yaml (macOS), or %ProgramData%\fleet\agent.yaml
# (Windows) by `fleet-agent enroll`.

# The name this host enrolled under, written by `enroll` from the name the
# control plane assigned. Every audit record below is stamped with it, and a
# record shipped off-box that does not name its machine cannot be acted on — so
# a hand-written configuration that omits this loses that, silently.
name: "build-box"

# Address the agent serves gRPC on. The MCP server dials this.
listen: "0.0.0.0:8722"

# Identity issued during enrollment. The private key is generated on this host
# and never leaves it.
tls:
  # Mutual TLS: both ends present a certificate issued by the fleet CA, and
  # this is the whole of the agent's own authentication.
  #
  # Unset means "on if the paths below are set", so a config `fleet-agent
  # enroll` wrote authenticates and one hand-written for a trusted network does
  # not. `enroll` writes it explicitly, and so does every save of this file.
  #
  # WITH IT FALSE THIS AGENT AUTHENTICATES NOBODY. It serves plaintext: no
  # client certificate is demanded, none is presented, and nothing is
  # encrypted by this product. Whatever authenticates and encrypts the
  # connection is the network — a Tailscale tailnet, a WireGuard mesh, a VPC
  # with tight security groups — and if the network does not do that, then
  # anyone who can reach this port can run commands on this host.
  #
  # So the daemon refuses to start with it false on a listen address that is
  # neither loopback nor private, unless `serve` is given
  # --allow-unauthenticated-public. It warns at every start either way, it
  # shows as `auth none` in `fleetctl list` and `fleet_info`, and every audit
  # record it writes names the address the call came from rather than a
  # verified identity ("principal_source": "network"). See docs/security.md.
  #
  # The three paths below are required only when this is true.
  enabled: true
  certificate: "/etc/fleet/agent.crt"
  private_key: "/etc/fleet/agent.key"
  ca_bundle: "/etc/fleet/ca.crt"
  # Client certificates must be issued by the CA above and carry this
  # organisational unit. It is checked whenever mTLS is on.
  #
  # This one name still reads "sandboxd" after the fleet rebrand, and that is
  # deliberate: it is stamped into every certificate the CA has already issued
  # and is checked at every handshake. Renaming it would need every member of
  # the fleet re-enrolled on the same day. Leave it unless you are doing that.
  require_client_ou: "sandboxd-control"

# Filesystem confinement. Every path in every FileService call is resolved and
# then checked for containment under one of these roots.
#
# THIS APPLIES ONLY WHEN exec.enabled IS false. With exec on, a caller runs
#
#   ["sh", "-c", "echo pwned > /etc/passwd"]
#
# and never touches FileService, so these roots would confine nothing an
# attacker would do. The agent ignores them rather than pretending, says so at
# every start, and reports itself as unconfined over the wire. With exec
# disabled they are enforced, and an empty list is then refused unless `serve`
# is given --no-jail.
allowed_roots:
  - "/home/build/workspace"
  - "/tmp/fleet"

exec:
  # Running commands is what this product is for, so this defaults to true.
  # Setting it to false is what makes allowed_roots above a real boundary.
  enabled: true
  # Default wall-clock limit for fleet_exec. On expiry the agent SIGTERMs the
  # command's whole process group, then SIGKILLs it.
  default_timeout: "120s"
  # A request asking for longer than this is refused, with this value named,
  # rather than quietly shortened — a shortened one comes back as timed_out and
  # is indistinguishable from the command overrunning the caller's own limit.
  max_timeout: "3600s"
  # Output beyond this is dropped, with the omission reported to the caller.
  # The agent keeps draining the command's pipes past the cap: a process
  # blocked writing to a full pipe never exits.
  max_output_bytes: 2097152
  # Optional command policy. Empty deny list means default-allow: treat this
  # agent as a remote code execution service, because that is what it is.
  #
  # Both lists match on the resolved executable path, its symlink target, their
  # base names, and the full argv — so "sh" also catches /bin/../bin/sh, and an
  # entry may name a subcommand ("git push"). Entries may be filepath globs.
  # Deny is evaluated first.
  #
  # These are operational guardrails, not confinement. A name is not an
  # identity — an allow list holding "python3" admits any file so named,
  # including one the caller just wrote — and an allowed interpreter allows
  # everything it can run. See docs/security.md.
  deny_commands: []
  # When non-empty, this becomes an allow list and anything absent is refused.
  # Prefer absolute paths here.
  # allow_commands:
  #   - "/usr/bin/make"
  #   - "/usr/local/go/bin/go"

shell:
  # Interactive terminals: `fleetctl shell`. On means an operator who holds a
  # control certificate can get a real shell on this host, over the same mTLS
  # transport everything else uses.
  #
  # This is the most direct remote-code-execution surface in the product. It
  # grants nothing new — a caller who can reach exec above already runs whatever
  # it likes here — but it is the most convenient path to it, so every session
  # is recorded in the audit log below: who opened it, when, for how long, and
  # how it ended. Never what was typed or printed. See docs/security.md.
  #
  # Turning this off leaves exec on, which is a real choice: an agent that runs
  # commands for a model and hands nobody an interactive terminal. Turning off
  # *execution* is exec.enabled above, and that turns this off too — a terminal
  # is a way to run a command.
  #
  # There is deliberately no MCP tool for this. A model does not need an
  # interactive terminal, and streaming raw terminal bytes into a context window
  # is a bad trade in every direction.
  enabled: true
  # A session that carries no data in either direction for this long is ended
  # and its process tree killed.
  #
  # Both directions, so a shell watching a two-hour build is not reaped for the
  # crime of nobody typing. There is no value that disables it: an abandoned
  # session holds a pseudo-terminal, a process tree and a concurrency slot on
  # this machine, and "forever" is not a bound. Set it longer if you need
  # longer.
  idle_timeout: "30m"

process:
  # Agent-wide, not per-service: every service that starts a process takes its
  # slots from this one number, so an agent set to 32 runs 32 processes in
  # total rather than 32 of each kind.
  max_concurrent: 32
  # Per-process on-disk log cap before rotation.
  max_log_bytes: 33554432
  # In-memory ring buffer retained for fast tailing.
  ring_buffer_lines: 2000
  default_grace_period: "10s"
  # Hard ceiling on fleet_process_logs follow, so a tool call cannot hang.
  max_follow_duration: "60s"

forward:
  # Port forwarding: the `ssh -L` equivalent. On means a caller can reach a
  # port on THIS MACHINE'S loopback. Off means it can reach nothing.
  enabled: true
  # Non-loopback hosts a forward may target, and the reason this list is empty
  # by default.
  #
  # A forward to loopback reaches only what this machine is serving. A forward
  # to an arbitrary host reaches anything this machine's network reaches — so
  # an agent with no restriction is a general-purpose pivot into whatever
  # network it sits in, available to anyone who can call it. Listing a host
  # here is how you decide that is what you want, per host:
  #
  #   allowed_hosts: ["db.internal", "10.0.4.7"]
  #
  # An entry is a hostname, an address, or a CIDR block:
  #
  #   allowed_hosts: ["db.internal", "10.0.4.7", "10.9.0.0/16"]
  #
  # A hostname is matched literally and dialed by name — you listed a name
  # because the name is what routes. An address or block is matched against
  # whatever the target resolves to, and every address it resolves to has to
  # pass, so a name answering with one permitted and one unpermitted address is
  # refused rather than allowed on whichever came back first.
  #
  # Every connection is written to the audit log below — successful, refused,
  # or failed — with the host asked for, the address dialed, and how many bytes
  # went each way. Never the bytes themselves. A *forward* to this machine's own
  # loopback is the one exception: it reaches a port on a machine the caller
  # already has exec on. A proxied connection is recorded wherever it went,
  # because a proxy's destination is chosen per connection and the log is the
  # only place it exists.
  allowed_hosts: []
  # SOCKS5 proxying: the `ssh -D` equivalent, used by `fleetctl socks` and the
  # fleet_socks tool. Off by default, and separate from allowed_hosts above
  # because they are different grants.
  #
  # A forward reaches a host and port the caller named up front. A proxy reaches
  # whatever a client asks for, connection by connection, which makes this agent
  # a general-purpose route into its network rather than a route to one service
  # on it. So an agent with allowed_hosts set still forwards to exactly those
  # hosts and serves no proxy at all until this is turned on.
  #
  # With this on and allowed_hosts empty, a proxied connection may reach ANY
  # host this machine can. That is a reasonable choice for a throwaway lab box
  # and a poor one anywhere else — the agent warns about it at every start, and
  # the fleet_socks tool refuses to open a proxy on those terms at all, because
  # "any host" is a decision an operator makes for themselves rather than one a
  # model inherits.
  #
  # An allowed_hosts of ["0.0.0.0/0"] is that same posture written so that it
  # looks like a narrowing, and it is treated as the same thing: the warning
  # fires, and fleet_socks refuses. A block that covers its whole address family
  # narrows nothing, whatever the length of the list says.
  socks_enabled: false
  # Concurrent connections this agent will carry over ForwardService — a port
  # forward's and a proxy's alike, since both are one stream per connection.
  #
  # A proxy is what makes this number visible: a forward carries one client's
  # connections to one port, and a proxy carries whatever is pointed at it, so a
  # browser or a parallel fetch reaches this bound where a forward never would.
  # The connection past it is refused rather than queued, and the caller is told
  # which setting refused it.
  max_connections: 64
  # How long to wait for the sandbox-side port to accept.
  dial_timeout: "10s"

audit:
  # Append-only JSONL record of every exec, every shell session, every write,
  # and every forwarded connection that leaves this machine: timestamp,
  # authenticated principal, this sandbox's name, RPC, outcome, duration, and
  # then what the operation has — argv and resolved path and working directory
  # for a command or a session, the requested and dialed addresses and the byte
  # counts for a connection.
  #
  # Never the environment, file contents, stdin, command output, what a terminal
  # session carried, or the bytes a forward carried — a tunnel and a shell both
  # carry whatever the caller sends through them, and a log that captured that
  # would be a credential store nobody meant to build. It is a forensic record,
  # not an enforcement mechanism: a caller who
  # can run commands on this host can also reach this file. Ship it off-host if
  # it needs to survive the host.
  path: "/var/log/fleet/audit.jsonl"
  enabled: true
  # With this set, an RPC whose audit record could not be written fails.
  # Without it, the failure is logged and the call proceeds. Choose the one
  # your agent is for: "must not act unrecorded", or "must keep serving when
  # the log volume fills".
  required: false
  # Rotation. The live file is moved to audit.jsonl.1 at this size, older
  # segments shift down, and anything past retain_segments is deleted.
  max_bytes: 67108864
  retain_segments: 5

# Supervised process records live here, so they survive a daemon restart — and
# an uninstall, which deliberately leaves this directory alone.
state_dir: "/var/lib/fleet"

log:
  # debug, info, warn, or error.
  level: "info"
  # "text" or "json". Logs go to stderr, which is what journald, launchd's
  # StandardErrorPath, and the Windows event log all capture.
  format: "text"
