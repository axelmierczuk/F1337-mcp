# fleet-agent configuration.
#
# Written to /etc/fleet/agent.yaml (Linux), /Library/Application
# Support/fleet/agent.yaml (macOS), or %ProgramData%\fleet\agent.yaml
# (Windows) by `fleet-agent enroll`.

# The name this host enrolled under, written by `enroll` from the name the
# control plane assigned. Every audit record below is stamped with it, and a
# record shipped off-box that does not name its machine cannot be acted on — so
# a hand-written configuration that omits this loses that, silently.
name: "build-box"

# Address the agent serves gRPC on. The MCP server dials this.
listen: "0.0.0.0:8722"

# Identity issued during enrollment. The private key is generated on this host
# and never leaves it.
tls:
  certificate: "/etc/fleet/agent.crt"
  private_key: "/etc/fleet/agent.key"
  ca_bundle: "/etc/fleet/ca.crt"
  # Client certificates must be issued by the CA above and carry this
  # organisational unit. mTLS is mandatory; there is no plaintext mode.
  #
  # This one name still reads "sandboxd" after the fleet rebrand, and that is
  # deliberate: it is stamped into every certificate the CA has already issued
  # and is checked at every handshake. Renaming it would need every member of
  # the fleet re-enrolled on the same day. Leave it unless you are doing that.
  require_client_ou: "sandboxd-control"

# Filesystem confinement. Every path in every FileService call is resolved and
# then checked for containment under one of these roots.
#
# THIS APPLIES ONLY WHEN exec.enabled IS false. With exec on, a caller runs
#
#   ["sh", "-c", "echo pwned > /etc/passwd"]
#
# and never touches FileService, so these roots would confine nothing an
# attacker would do. The agent ignores them rather than pretending, says so at
# every start, and reports itself as unconfined over the wire. With exec
# disabled they are enforced, and an empty list is then refused unless `serve`
# is given --no-jail.
allowed_roots:
  - "/home/build/workspace"
  - "/tmp/fleet"

exec:
  # Running commands is what this product is for, so this defaults to true.
  # Setting it to false is what makes allowed_roots above a real boundary.
  enabled: true
  # Default wall-clock limit for fleet_exec. On expiry the agent SIGTERMs the
  # command's whole process group, then SIGKILLs it.
  default_timeout: "120s"
  # A request asking for longer than this is refused, with this value named,
  # rather than quietly shortened — a shortened one comes back as timed_out and
  # is indistinguishable from the command overrunning the caller's own limit.
  max_timeout: "3600s"
  # Output beyond this is dropped, with the omission reported to the caller.
  # The agent keeps draining the command's pipes past the cap: a process
  # blocked writing to a full pipe never exits.
  max_output_bytes: 2097152
  # Optional command policy. Empty deny list means default-allow: treat this
  # agent as a remote code execution service, because that is what it is.
  #
  # Both lists match on the resolved executable path, its symlink target, their
  # base names, and the full argv — so "sh" also catches /bin/../bin/sh, and an
  # entry may name a subcommand ("git push"). Entries may be filepath globs.
  # Deny is evaluated first.
  #
  # These are operational guardrails, not confinement. A name is not an
  # identity — an allow list holding "python3" admits any file so named,
  # including one the caller just wrote — and an allowed interpreter allows
  # everything it can run. See docs/security.md.
  deny_commands: []
  # When non-empty, this becomes an allow list and anything absent is refused.
  # Prefer absolute paths here.
  # allow_commands:
  #   - "/usr/bin/make"
  #   - "/usr/local/go/bin/go"

process:
  # Agent-wide, not per-service: every service that starts a process takes its
  # slots from this one number, so an agent set to 32 runs 32 processes in
  # total rather than 32 of each kind.
  max_concurrent: 32
  # Per-process on-disk log cap before rotation.
  max_log_bytes: 33554432
  # In-memory ring buffer retained for fast tailing.
  ring_buffer_lines: 2000
  default_grace_period: "10s"
  # Hard ceiling on fleet_process_logs follow, so a tool call cannot hang.
  max_follow_duration: "60s"

forward:
  # Port forwarding: the `ssh -L` equivalent. On means a caller can reach a
  # port on THIS MACHINE'S loopback. Off means it can reach nothing.
  enabled: true
  # Non-loopback hosts a forward may target, and the reason this list is empty
  # by default.
  #
  # A forward to loopback reaches only what this machine is serving. A forward
  # to an arbitrary host reaches anything this machine's network reaches — so
  # an agent with no restriction is a general-purpose pivot into whatever
  # network it sits in, available to anyone who can call it. Listing a host
  # here is how you decide that is what you want, per host:
  #
  #   allowed_hosts: ["db.internal", "10.0.4.7"]
  #
  # Every connection to a host that is not this machine's loopback is written
  # to the audit log below — successful, refused, or failed — with the host
  # asked for, the address dialed, and how many bytes went each way. Never the
  # bytes themselves. Loopback forwards are not recorded: they reach a port on
  # a machine the caller already has exec on.
  allowed_hosts: []
  # Concurrent forwarded connections this agent will carry.
  max_connections: 64
  # How long to wait for the sandbox-side port to accept.
  dial_timeout: "10s"

audit:
  # Append-only JSONL record of every exec, every write, and every forwarded
  # connection that leaves this machine: timestamp, authenticated principal,
  # this sandbox's name, RPC, outcome, duration, and then what the operation
  # has — argv and resolved path and working directory for a command, the
  # requested and dialed addresses and the byte counts for a connection.
  #
  # Never the environment, file contents, stdin, command output, or the bytes
  # a forward carried — a tunnel carries whatever the caller sends through it,
  # and a log that captured that would be a credential store nobody meant to
  # build. It is a forensic record, not an enforcement mechanism: a caller who
  # can run commands on this host can also reach this file. Ship it off-host if
  # it needs to survive the host.
  path: "/var/log/fleet/audit.jsonl"
  enabled: true
  # With this set, an RPC whose audit record could not be written fails.
  # Without it, the failure is logged and the call proceeds. Choose the one
  # your agent is for: "must not act unrecorded", or "must keep serving when
  # the log volume fills".
  required: false
  # Rotation. The live file is moved to audit.jsonl.1 at this size, older
  # segments shift down, and anything past retain_segments is deleted.
  max_bytes: 67108864
  retain_segments: 5

# Supervised process records live here, so they survive a daemon restart — and
# an uninstall, which deliberately leaves this directory alone.
state_dir: "/var/lib/fleet"

log:
  # debug, info, warn, or error.
  level: "info"
  # "text" or "json". Logs go to stderr, which is what journald, launchd's
  # StandardErrorPath, and the Windows event log all capture.
  format: "text"
